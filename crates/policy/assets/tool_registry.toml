# Maps kicad-mcp-pro MCP tool names to a required capability and a risk
# classification. Any tool name not listed here is denied by
# TomlToolRegistry::resolve — there is no fallback allow.
#
# Authorization allowlist only. Upstream discovery never grants access.
# Drift is tracked separately in upstream_tool_snapshot.toml and checked by
# crates/policy/tests/tool_registry.rs. Refresh the snapshot with the
# reconcile-tool-registry binary documented in docs/development/testing.md.

